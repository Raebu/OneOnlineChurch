name: Import approved brand artwork
on:
  push:
    branches:
      - design/brand-header-hero
    paths:
      - .github/workflows/import-brand-assets.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimiser
        run: python -m pip install 'Pillow==11.3.0'
      - name: Retrieve generated artwork and package responsive images
        env:
          LOGO_URL: https://at.adobe.com/WOD0MupuFYQPEogL
          HERO_URL: https://at.adobe.com/ujPEFdQq1QWOdCDG
        run: |
          python - <<'PY'
          import os, io, urllib.request
          from pathlib import Path
          from PIL import Image
          dest=Path('public/assets')
          dest.mkdir(parents=True,exist_ok=True)
          for name,url,bounds,quality in [
              ('brand-globe.webp',os.environ['LOGO_URL'],(720,720),83),
              ('earth-sunrise.webp',os.environ['HERO_URL'],(1600,900),78),
          ]:
              req=urllib.request.Request(url,headers={'User-Agent':'OneOnlineChurch-Brand-Asset-Importer/1.0'})
              with urllib.request.urlopen(req,timeout=35) as response:
                  raw=response.read(9_000_000)
              if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise ValueError(f'Unexpected source file for {name}: not a PNG')
              img=Image.open(io.BytesIO(raw))
              img.load()
              img.thumbnail(bounds,Image.Resampling.LANCZOS)
              img.save(dest/name,format='WEBP',quality=quality,method=6)
              print(name,img.size,(dest/name).stat().st_size)
          PY
      - name: Commit real image assets into this pull request
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/brand-globe.webp public/assets/earth-sunrise.webp
          git diff --cached --quiet || git commit -m 'assets: add generated OneOnlineChurch brand images'
          git push origin HEAD:design/brand-header-hero
